# Alembic configuration for the decision store (U9).
#
# Run from the repository root:
#
#   DATABASE_URL=postgresql+psycopg://... alembic -c service/alembic.ini upgrade head
#
# `sqlalchemy.url` is deliberately blank. The database URL is a deployment
# secret and belongs in the environment, not in a file that is committed; env.py
# reads DATABASE_URL when this option is empty. Tests set it programmatically
# instead, which is why the option exists at all rather than being removed.

[alembic]
script_location = service/migrations
prepend_sys_path = .
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
