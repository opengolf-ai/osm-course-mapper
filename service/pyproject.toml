[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osm-course-mapper-service"
version = "0.1.0"
description = "Server-side hole feature detection over public-domain NAIP imagery."
requires-python = ">=3.11,<3.13"

# The core set deliberately excludes torch and segment-geospatial.
#
# Those two are gigabytes and only U2 imports them, while U1, U3, U4, U5 and U9
# are pure geometry, HTTP and persistence. Keeping the model out of the base
# install means `pytest service/` is a runnable gate in CI and on a laptop, not
# only inside a fully provisioned GPU image — which is what U0 exists to
# guarantee. Install the `segmentation` extra to run segmentation for real.
dependencies = [
  # Raster read and reprojection. rasterio ships GDAL in its wheels.
  "rasterio>=1.3",
  "pyproj>=3.6",
  "numpy>=1.26",
  # Shapely 2 is not optional: topojson requires it, and segment-geospatial's
  # geopandas dependency chain requires it too. Pinning the major version here
  # is what keeps KTD7's topology-preserving simplification installable at all.
  "shapely>=2.0",
  "topojson>=1.9",
  # Imagery discovery and anonymous asset signing.
  "pystac-client>=0.7",
  "planetary-computer>=1.0",
  # Service surface.
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  # Decision store (U9). psycopg 3 with the binary extra so the devcontainer
  # needs no local libpq build step.
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
# Everything U2 needs to actually run a model. Split out so the rest of the
# service installs and tests without a multi-gigabyte download.
segmentation = [
  "segment-geospatial>=0.12",
  "torch>=2.2",
  "torchvision>=0.17",
  "opencv-python-headless>=4.9",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["service*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Two markers keep the default run honest about what it did and did not prove:
#   heavy   — needs the `segmentation` extra (torch + a SAM checkpoint)
#   network — reaches a live external service (Planetary Computer, Postgres)
# Neither is deselected by default; CI and local runs opt out explicitly with
# `-m "not heavy"` so a skipped model test is a visible choice, not a silent one.
markers = [
  "heavy: requires the segmentation extra and a downloaded model checkpoint",
  "network: reaches a live external service",
]

[tool.ruff]
line-length = 100
target-version = "py311"
